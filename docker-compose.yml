version: '3.9'

services:
  # RAG Agent API Service
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      # Azure OpenAI Configuration
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: 2024-02-15-preview
      
      # Azure Storage Configuration
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      AZURE_STORAGE_CONTAINER_NAME: documents
      
      # Azure Cognitive Search Configuration
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
      AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY}
      AZURE_SEARCH_INDEX_NAME: rag-documents
      
      # Vector Store Configuration
      VECTOR_STORE_TYPE: azure_search
      CHUNK_SIZE: "1000"
      CHUNK_OVERLAP: "200"
      TOP_K_CHUNKS: "5"
      
      # LLM Configuration
      LLM_TEMPERATURE: "0.7"
      LLM_MAX_TOKENS: "2000"
      
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      WORKERS: "4"
      
      # Logging
      LOG_LEVEL: "INFO"
    
    volumes:
      - ./documents:/mnt/documents:ro
      - ./src:/app/src
    
    networks:
      - rag-network
    
    depends_on:
      - redis-cache
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    # Resource limits for local testing
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Redis Cache (optional - for caching embeddings)
  redis-cache:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rag-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # PostgreSQL (optional - for persistent data if using Chroma vector store)
  postgres:
    image: postgres:15-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles:
      - with-postgres

  # Chroma Vector Store (alternative to Azure Cognitive Search for local testing)
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag-chroma
    environment:
      CHROMA_DB_IMPL: duckdb+parquet
      PERSIST_DIRECTORY: /chroma/data
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles:
      - with-chroma

  # Prometheus (optional - for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - with-monitoring

  # Grafana (optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - rag-network
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - with-monitoring

  # Testing container (for running tests)
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-test
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    networks:
      - rag-network
    depends_on:
      rag-api:
        condition: service_healthy
    command: pytest tests/ -v --cov=src
    profiles:
      - test

networks:
  rag-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  chroma-data:
  prometheus-data:
  grafana-data:

# Usage:
#
# 1. Basic usage (API only):
#    docker-compose up
#
# 2. With PostgreSQL + Chroma:
#    docker-compose --profile with-postgres --profile with-chroma up
#
# 3. With monitoring (Prometheus + Grafana):
#    docker-compose --profile with-monitoring up
#    Grafana: http://localhost:3000
#    Prometheus: http://localhost:9090
#
# 4. Run tests:
#    docker-compose --profile test run test
#
# 5. Stop all services:
#    docker-compose down
#
# 6. Remove all volumes:
#    docker-compose down -v
#
# 7. View logs:
#    docker-compose logs -f rag-api
#    docker-compose logs -f redis-cache
